# Configuração do job de migração usada pelo core (montada no container).
# Datasources de source/target/batch podem ser sobrescritos por env no Compose.
# Ajuste source-table / column-mapping ao banco externo do adotante.

spring:
  application:
    name: dsp-batch
  main:
    web-application-type: none
  datasource:
    batch:
      url: jdbc:postgresql://dsp-job-migration-db:5432/dsp-job-migration-db
      username: dsp_job
      password: dsp_job
      driver-class-name: org.postgresql.Driver
    source:
      url: jdbc:postgresql://host.docker.internal:5432/source_db
      username: source_user
      password: source_user
      driver-class-name: org.postgresql.Driver
    target:
      url: jdbc:postgresql://dsp-db:5432/dsp-db
      username: dsp
      password: dsp
      driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: 8086

batch:
  admin-unit:
    level-1:
      source-table: source_schema.level1
      target-table: dsp.level1
      primary-key: id
      geometry-column: geometry
      where-clause: "1=1"
      comparison-columns:
        - label
      persist-columns:
        - id
        - label
      column-mapping:
        id: id
        label: label
        geometry: geometry
      layer-name: level1
      srid: 4326
      change-detection-strategy: DEFAULT
    level-2:
      source-table: source_schema.level2
      target-table: dsp.level2
      primary-key: id
      geometry-column: geometry
      where-clause: "1=1"
      comparison-columns:
        - label
        - level1_id
      persist-columns:
        - id
        - label
        - level1_id
      column-mapping:
        id: id
        label: label
        level1_id: level1_id
        geometry: geometry
      layer-name: level2
      srid: 4326
      change-detection-strategy: DEFAULT
    level-3:
      source-table: source_schema.level3
      target-table: dsp.level3
      primary-key: id
      geometry-column: geometry
      where-clause: "1=1"
      comparison-columns:
        - label
        - level2_id
      persist-columns:
        - id
        - label
        - level2_id
      column-mapping:
        id: id
        label: label
        level2_id: level2_id
        geometry: geometry
      layer-name: level3
      srid: 4326
      change-detection-strategy: DEFAULT

execution-jobs:
  admin-unit-level-1-geoserver-job: true
  admin-unit-level-2-geoserver-job: true
  admin-unit-level-3-geoserver-job: true
  rural-property-geoserver-job: false

logging:
  level:
    br.car.dsp_batch: INFO
