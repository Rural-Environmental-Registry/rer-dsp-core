# Job de migração montado pelo core (Compose → /config/application.yaml).
# Mapeamento CAR Nacional (usr_geocar_aplicacao) → dsp.territory_level_* + area_of_interest.
# Origem do mapeamento: DSP/application.yaml (colega). Datasources ajustados para o stack Docker.
#
# Source JDBC também pode vir do .env (DSP_SOURCE_*), que tem precedência no Compose.

spring:
  application:
    name: dsp-batch
  main:
    web-application-type: none
  datasource:
    batch:
      url: jdbc:postgresql://dsp-job-migration-db:5432/dsp-job-migration-db
      username: dsp_job
      password: dsp_job
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: batch-pool
        connection-test-query: SELECT 1
    source:
      # Host CAR acessível da rede do container (VPN/DNS no host).
      url: jdbc:postgresql://source-db-host:5433/car_nacional
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        pool-name: source-pool
    target:
      url: jdbc:postgresql://dsp-db:5432/dsp-db
      username: dsp
      password: dsp
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        pool-name: target-pool
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: 8086

batch:
  admin-unit:
    # Brasil (installation): L1=região, L2=estado, L3=município.
    level-1:
      # REGIOES não tem geometria própria: une geo_localizacao dos estados da região.
      source-table: >-
        (SELECT r.id_regiao,
                r.te_nome_regiao,
                ST_Multi(ST_CollectionExtract(ST_MakeValid(ST_Union(e.geo_localizacao)), 3)) AS geo_localizacao
         FROM usr_geocar_aplicacao.regioes r
         INNER JOIN usr_geocar_aplicacao.estado e ON e.id_regiao = r.id_regiao
         WHERE e.geo_localizacao IS NOT NULL
         GROUP BY r.id_regiao, r.te_nome_regiao) AS src_l1
      target-table: dsp.territory_level_1
      primary-key: id_regiao
      geometry-column: geo_localizacao
      # Regiões das UFs presentes na amostra de imóveis (até 12 ativos por UF).
      where-clause: >-
        id_regiao IN (
          SELECT DISTINCT e.id_regiao
          FROM usr_geocar_aplicacao.estado e
          WHERE e.id_regiao IS NOT NULL
            AND e.cod_estado IN (
              SELECT DISTINCT m.cod_estado
              FROM usr_geocar_aplicacao.imovel i
              INNER JOIN usr_geocar_aplicacao.municipio m ON m.idt_municipio = i.idt_municipio
              WHERE i.idt_imovel IN (
                SELECT amostra.idt_imovel
                FROM (
                  SELECT i2.idt_imovel,
                         ROW_NUMBER() OVER (PARTITION BY m2.cod_estado ORDER BY i2.idt_imovel) AS rn
                  FROM usr_geocar_aplicacao.imovel i2
                  INNER JOIN usr_geocar_aplicacao.municipio m2 ON m2.idt_municipio = i2.idt_municipio
                  WHERE i2.flg_ativo = true
                ) amostra
                WHERE amostra.rn <= 12
              )
            )
        )
      comparison-columns:
        - te_nome_regiao
      persist-columns:
        - id_regiao
        - te_nome_regiao
      column-mapping:
        id_regiao: id
        te_nome_regiao: name
        geo_localizacao: geometry
      layer-name: territory-level-1
      srid: 4674
      change-detection-strategy: DEFAULT
    level-2:
      source-table: usr_geocar_aplicacao.estado
      target-table: dsp.territory_level_2
      primary-key: cod_estado
      partition-column: id_regiao
      geometry-column: geo_localizacao
      # UFs presentes na mesma amostra de imóveis.
      where-clause: >-
        cod_estado IN (
          SELECT DISTINCT m.cod_estado
          FROM usr_geocar_aplicacao.imovel i
          INNER JOIN usr_geocar_aplicacao.municipio m ON m.idt_municipio = i.idt_municipio
          WHERE i.idt_imovel IN (
            SELECT amostra.idt_imovel
            FROM (
              SELECT i2.idt_imovel,
                     ROW_NUMBER() OVER (PARTITION BY m2.cod_estado ORDER BY i2.idt_imovel) AS rn
              FROM usr_geocar_aplicacao.imovel i2
              INNER JOIN usr_geocar_aplicacao.municipio m2 ON m2.idt_municipio = i2.idt_municipio
              WHERE i2.flg_ativo = true
            ) amostra
            WHERE amostra.rn <= 12
          )
        )
      comparison-columns:
        - nom_estado
        - id_regiao
      persist-columns:
        - cod_estado
        - nom_estado
        - id_regiao
      column-mapping:
        cod_estado: id
        nom_estado: name
        id_regiao: parent_id
        geo_localizacao: geometry
      layer-name: territory-level-2
      srid: 4674
      change-detection-strategy: DEFAULT
    level-3:
      source-table: usr_geocar_aplicacao.municipio
      target-table: dsp.territory_level_3
      primary-key: idt_municipio
      partition-column: cod_estado
      geometry-column: geo_localizacao
      # Municípios da mesma amostra de imóveis.
      where-clause: >-
        idt_municipio IN (
          SELECT DISTINCT i.idt_municipio
          FROM usr_geocar_aplicacao.imovel i
          WHERE i.idt_imovel IN (
            SELECT amostra.idt_imovel
            FROM (
              SELECT i2.idt_imovel,
                     ROW_NUMBER() OVER (PARTITION BY m2.cod_estado ORDER BY i2.idt_imovel) AS rn
              FROM usr_geocar_aplicacao.imovel i2
              INNER JOIN usr_geocar_aplicacao.municipio m2 ON m2.idt_municipio = i2.idt_municipio
              WHERE i2.flg_ativo = true
            ) amostra
            WHERE amostra.rn <= 12
          )
        )
      comparison-columns:
        - nom_municipio
        - cod_estado
      persist-columns:
        - idt_municipio
        - nom_municipio
        - cod_estado
      column-mapping:
        idt_municipio: id
        nom_municipio: name
        cod_estado: parent_id
        geo_localizacao: geometry
      layer-name: territory-level-3
      srid: 4674
      change-detection-strategy: DEFAULT
  area-of-interest:
    source-table: usr_geocar_aplicacao.imovel
    target-table: dsp.area_of_interest
    primary-key: cod_imovel
    geometry-column: geo_area_imovel
    # Amostra de validação: até 12 imóveis ativos por UF (~300 no total, estados diversos).
    # Atenção: com DEFAULT, o que estiver no target fora deste filtro pode ser apagado como órfão.
    where-clause: >-
      idt_imovel IN (
        SELECT amostra.idt_imovel
        FROM (
          SELECT i.idt_imovel,
                 ROW_NUMBER() OVER (PARTITION BY m.cod_estado ORDER BY i.idt_imovel) AS rn
          FROM usr_geocar_aplicacao.imovel i
          INNER JOIN usr_geocar_aplicacao.municipio m ON m.idt_municipio = i.idt_municipio
          WHERE i.flg_ativo = true
        ) amostra
        WHERE amostra.rn <= 12
      )
    comparison-columns:
      - dat_atualizacao
      - idt_municipio
      - num_area_imovel
    persist-columns:
      - cod_imovel
      - dat_criacao
      - dat_atualizacao
      - idt_municipio
      - num_area_imovel
    column-mapping:
      cod_imovel: id
      dat_criacao: registration_date
      dat_atualizacao: alteration_date
      idt_municipio: territory_level_3_id
      num_area_imovel: area
      geo_area_imovel: geometry
    layer-name: area-of-interest
    srid: 4674
    change-detection-strategy: DEFAULT

parallelization:
  jobs:
    adminUnitLevel1GeoserverJob:
      enabled: true
      thread-pool-size: 1
      chunk-size: 1
      page-size: 1000
      queue-capacity: 100
    adminUnitLevel2GeoserverJob:
      enabled: true
      thread-pool-size: 12
      chunk-size: 1
      page-size: 1000
      queue-capacity: 100
    adminUnitLevel3GeoserverJob:
      enabled: true
      thread-pool-size: 12
      chunk-size: 470
      page-size: 1000
      queue-capacity: 100
    areaOfInterestGeoserverJob:
      enabled: true
      thread-pool-size: 1
      chunk-size: 100
      page-size: 1000
      queue-capacity: 100

execution-jobs:
  admin-unit-level-1-geoserver-job: true
  admin-unit-level-2-geoserver-job: true
  admin-unit-level-3-geoserver-job: true
  area-of-interest-geoserver-job: true

logging:
  level:
    br.car.dsp_batch: INFO
    br.car.dsp_batch.batch.strategy: INFO
