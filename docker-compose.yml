# =============================================================================
# RER DSP — Core
# Minimal local stack: backend + frontend
# =============================================================================
# Prerequisites:
#   - Docker Compose v1
#   - Sibling repos cloned (see docs/submodules.md)
#   - cp .env.example .env
#
# Usage:
#   ./start.sh
#   # or: docker compose up -d --build
# =============================================================================

services:
  dsp-backend:
    image: dsp-backend:local
    build:
      context: ${DSP_BACKEND_PATH:-../rer-dsp-backend}
      dockerfile: Dockerfile
      args:
        DSP_BACKEND_PROJECT_NAME: dsp
        DSP_BACKEND_VERSION: 0.0.1-SNAPSHOT
    container_name: dsp-backend
    restart: unless-stopped
    ports:
      - "${DSP_BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SERVER_SERVLET_CONTEXT_PATH: ${DSP_BACKEND_CONTEXT_PATH:-/dsp-backend}
      DSP_CORS_ALLOWED_ORIGINS: ${DSP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost/dsp,http://localhost:5173,http://localhost:8081}
    networks:
      - dsp_network

  dsp-frontend:
    image: dsp-frontend:local
    build:
      context: ${DSP_FRONTEND_PATH:-../rer-dsp-frontend}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_BASE_URL: ${VITE_BASE_URL:-/dsp/}
        VITE_DSP_API_URL: ${VITE_DSP_API_URL:-http://localhost:8080/dsp-backend}
    container_name: dsp-frontend
    restart: unless-stopped
    ports:
      - "${DSP_FRONTEND_HOST_PORT:-8081}:8080"
    depends_on:
      - dsp-backend
    networks:
      - dsp_network

networks:
  dsp_network:
    name: dsp_network
