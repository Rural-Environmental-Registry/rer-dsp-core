# =============================================================================
# RER DSP — Core
# Local stack: databases + optional migration job + backend + frontend
# =============================================================================
# Prerequisites:
#   - Docker Compose v2
#   - Sibling repos cloned (see docs/submodules.md)
#   - cp .env.example .env
#
# Usage:
#   ./start.sh
#   # Migration (optional): DSP_RUN_MIGRATION=true ./start.sh
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DSP DB — base operacional PostGIS (levels 1–3)
  # ---------------------------------------------------------------------------
  dsp-db:
    image: postgis/postgis:16-3.4
    container_name: dsp-db
    restart: unless-stopped
    ports:
      - "${DSP_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DSP_DB_NAME:-dsp-db}
      POSTGRES_USER: ${DSP_DB_USER:-dsp}
      POSTGRES_PASSWORD: ${DSP_DB_PASSWORD:-dsp}
    volumes:
      - dsp_db_data:/var/lib/postgresql/data
      - ./config/db/dsp-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - dsp_network

  # ---------------------------------------------------------------------------
  # Job migration DB — metadados Spring Batch (BATCH_*)
  # ---------------------------------------------------------------------------
  dsp-job-migration-db:
    image: postgres:16
    container_name: dsp-job-migration-db
    restart: unless-stopped
    ports:
      - "${DSP_JOB_MIGRATION_DB_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DSP_JOB_MIGRATION_DB_NAME:-dsp-job-migration-db}
      POSTGRES_USER: ${DSP_JOB_MIGRATION_DB_USER:-dsp_job}
      POSTGRES_PASSWORD: ${DSP_JOB_MIGRATION_DB_PASSWORD:-dsp_job}
    volumes:
      - dsp_job_migration_db_data:/var/lib/postgresql/data
      - ./config/db/dsp-job-migration-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dsp_network

  # ---------------------------------------------------------------------------
  # Job data-migration — one-shot (disparado por start.sh quando
  # DSP_RUN_MIGRATION=true). Não sobe com `docker compose up` padrão.
  # ---------------------------------------------------------------------------
  dsp-job-migration:
    image: dsp-job-migration:local
    build:
      context: ${DSP_JOB_MIGRATION_PATH:-../rer-dsp-job-data-migration}
      dockerfile: Dockerfile
    container_name: dsp-job-migration
    profiles:
      - migration
    restart: "no"
    volumes:
      - ./config/Job-Data-Migration/application/application.yaml:/config/application.yaml:ro
    environment:
      SPRING_CONFIG_LOCATION: file:/config/application.yaml
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_BATCH_URL: jdbc:postgresql://dsp-job-migration-db:5432/${DSP_JOB_MIGRATION_DB_NAME:-dsp-job-migration-db}
      SPRING_DATASOURCE_BATCH_USERNAME: ${DSP_JOB_MIGRATION_DB_USER:-dsp_job}
      SPRING_DATASOURCE_BATCH_PASSWORD: ${DSP_JOB_MIGRATION_DB_PASSWORD:-dsp_job}
      SPRING_DATASOURCE_TARGET_URL: jdbc:postgresql://dsp-db:5432/${DSP_DB_NAME:-dsp-db}
      SPRING_DATASOURCE_TARGET_USERNAME: ${DSP_DB_USER:-dsp}
      SPRING_DATASOURCE_TARGET_PASSWORD: ${DSP_DB_PASSWORD:-dsp}
      SPRING_DATASOURCE_SOURCE_URL: ${DSP_SOURCE_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/source_db}
      SPRING_DATASOURCE_SOURCE_USERNAME: ${DSP_SOURCE_DB_USER:-source_user}
      SPRING_DATASOURCE_SOURCE_PASSWORD: ${DSP_SOURCE_DB_PASSWORD:-source_user}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dsp-db:
        condition: service_healthy
      dsp-job-migration-db:
        condition: service_healthy
    networks:
      - dsp_network

  dsp-backend:
    image: dsp-backend:local
    build:
      context: ${DSP_BACKEND_PATH:-../rer-dsp-backend}
      dockerfile: Dockerfile
      args:
        DSP_BACKEND_PROJECT_NAME: dsp
        DSP_BACKEND_VERSION: 0.0.1-SNAPSHOT
    container_name: dsp-backend
    restart: unless-stopped
    ports:
      - "${DSP_BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./config/installation/installation-config.json:/config/installation-config.json:ro
    environment:
      SERVER_SERVLET_CONTEXT_PATH: ${DSP_BACKEND_CONTEXT_PATH:-/dsp-backend}
      DSP_CORS_ALLOWED_ORIGINS: ${DSP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost/dsp,http://localhost:5173,http://localhost:8081}
      DSP_INSTALLATION_CONFIG_FILE: ${DSP_INSTALLATION_CONFIG_FILE:-file:/config/installation-config.json}
      SPRING_DATASOURCE_URL: jdbc:postgresql://dsp-db:5432/${DSP_DB_NAME:-dsp-db}
      SPRING_DATASOURCE_USERNAME: ${DSP_DB_USER:-dsp}
      SPRING_DATASOURCE_PASSWORD: ${DSP_DB_PASSWORD:-dsp}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      dsp-db:
        condition: service_healthy
    networks:
      - dsp_network

  dsp-frontend:
    image: dsp-frontend:local
    build:
      context: ${DSP_FRONTEND_PATH:-../rer-dsp-frontend}
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_BASE_URL: ${VITE_BASE_URL:-/dsp/}
        VITE_DSP_API_URL: ${VITE_DSP_API_URL:-http://localhost:8080/dsp-backend}
    container_name: dsp-frontend
    restart: unless-stopped
    ports:
      - "${DSP_FRONTEND_HOST_PORT:-8081}:8080"
    depends_on:
      - dsp-backend
    networks:
      - dsp_network

networks:
  dsp_network:
    name: dsp_network

volumes:
  dsp_db_data:
  dsp_job_migration_db_data:
